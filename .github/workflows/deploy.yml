name: Deploy Vite React to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Verify Pages build output
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { existsSync, readFileSync } from 'node:fs';

          const base = '/MidProjectJuegos/';
          const html = readFileSync('dist/index.html', 'utf8');
          assert(!html.includes('/src/main.jsx'), 'dist/index.html still references the source entry');

          const references = [...html.matchAll(/(?:src|href)="([^"]+)"/g)].map((match) => match[1]);
          const assets = references.filter((reference) => /\.(?:js|css)(?:[?#]|$)/.test(reference));
          assert(assets.some((asset) => /\.js(?:[?#]|$)/.test(asset)), 'No compiled JavaScript asset found');
          assert(assets.some((asset) => /\.css(?:[?#]|$)/.test(asset)), 'No compiled CSS asset found');

          for (const asset of assets) {
            assert(asset.startsWith(`${base}assets/`), `Asset does not use the Pages base path: ${asset}`);
            assert(existsSync(`dist/${asset.slice(base.length)}`), `Built asset is missing: ${asset}`);
          }
          NODE

      - name: Upload build output
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
